<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pregnancy Date Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --ink: #111;
        --muted: #666;
        --line: #e5e7eb;
        --accent: #0b62d6;
        --accent-d: #094ea4;
      }
      body {
        font-family: system-ui, -apple-system, 'Helvetica Neue', Arial,
          sans-serif;
        margin: 0;
        padding: 24px;
        color: var(--ink);
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      a.back {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 0.9rem;
        color: var(--accent);
        text-decoration: none;
      }
      h2 {
        margin: 12px 0 16px;
        font-size: 1.6rem;
        font-weight: 700;
      }
      form {
        margin: 8px 0 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      label {
        font-size: 0.95rem;
        color: var(--muted);
      }
      input[type='date'] {
        padding: 10px 12px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        padding: 10px 16px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-d);
      }
      ul {
        padding-left: 1.1rem;
        margin: 8px 0 0;
      }
      li {
        margin: 6px 0;
      }
      .error {
        color: #b00020;
        margin-top: 12px;
      }
      #copyWrap {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #copyMsg {
        font-size: 0.9rem;
        color: var(--muted);
        opacity: 0;
        transition: opacity 0.4s;
      }
      #copyMsg.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Back button outside wrap so it never moves -->
    <a href="/" class="back">← Back to Main Page</a>

    <div class="wrap">
      <h2>Pregnancy Date Calculator</h2>

      <form method="post" novalidate>
        <label for="transfer_date">Enter Embryo Transfer Date: </label>
        <input
          id="transfer_date"
          type="date"
          name="transfer_date"
          required
          value="{{ request.form.transfer_date or '' }}"
        />
        <button type="submit">Calculate</button>
      </form>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %} {% if results %}
      <h3>Pregnancy Management Dates</h3>
      <ul id="resultsList">
        {% for label, date in results.items() %}
        <li><strong>{{ label }}:</strong> {{ date }}</li>
        {% endfor %}
      </ul>

      <div id="copyWrap">
        <button id="copyBtn" onclick="copyResults()">Copy to Clipboard</button>
        <span id="copyMsg">Copied!</span>
      </div>

      <script>
        function copyResults() {
          const items = document.querySelectorAll('#resultsList li')
          let text = ''
          items.forEach(item => {
            text += item.innerText + '\n'
          })
          navigator.clipboard.writeText(text.trim()).then(() => {
            const msg = document.getElementById('copyMsg')
            msg.classList.add('show')
            setTimeout(() => msg.classList.remove('show'), 2000)
          })
        }
      </script>
      {% endif %}
    </div>
  </body>
</html>
